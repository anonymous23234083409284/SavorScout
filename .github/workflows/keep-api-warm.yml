# Pings the API every 10 minutes so Render's free tier never puts it to sleep.
#
# A free Render service spins down after 15 minutes without traffic, and the
# next request waits for it to boot, often 30 seconds or more. That wait used
# to land on a visitor's first search. Scheduled workflows are free on a public
# repository, and they only run from the default branch, so this starts once it
# is merged to main.
#
# GitHub can start scheduled runs a few minutes late under load, which is why
# the interval sits well inside Render's 15-minute window. GitHub also pauses
# schedules after 60 days with no commits to the repository; re-enable it from
# the Actions tab if that happens.
name: Keep API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping savorscout.onrender.com
        # Retries cover the case where the service was already asleep and the
        # first attempt times out while it boots. Never fails the run: a missed
        # ping is not worth an error email every ten minutes.
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 https://savorscout.onrender.com/ || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::warning::API did not answer 200 after 3 attempts"
